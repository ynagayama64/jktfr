<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>城西大川越陸上部 記録管理 ページ</title>
    <meta
      name="description"
      content="城西大川越陸上部 記録管理アプリの初回設定用入口ページです。"
    >
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">JKTFR</p>
        <h1 id="page-title">城西大川越陸上部<br>記録管理 ページ</h1>
        <p class="subtitle">Josai Kawagoe Track &amp; Field Records</p>
      </section>

      <section class="panel intro" aria-label="このページについて">
        <p>このページは初回設定用です。</p>
        <p>学校Googleアカウントでログインした Chrome / Safari などのブラウザで利用してください。</p>
      </section>

      <section id="browser-warning" class="warning" aria-live="polite" hidden>
        <div class="warning-mark" aria-hidden="true">!</div>
        <div>
          <h2>アプリ内ブラウザで開かれている可能性があります</h2>
          <p>LINEやアプリ内ブラウザでは、Googleログインがうまく動かないことがあります。</p>
          <p>右上メニューから Chrome / Safari で開いてください。</p>
        </div>
      </section>

      <section class="action-area" aria-label="記録入力画面">
        <button id="open-app" class="primary-button" type="button">
          記録入力画面を開く
        </button>
        <p class="helper-text">うまく開かない場合は、Chrome / Safariでこのページを開き直してください。</p>
      </section>

      <footer class="footer-links">
        <a
          href="https://script.google.com/a/macros/k-josai.com/s/AKfycbw9XmAR5blFNMaDJumlrXpslIJdMNyek8RD_0vdi8ASWSUXsxX9bw9vfhWTaQEMHAltIg/exec?view=record_manage"
        >
          顧問ページ
        </a>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
